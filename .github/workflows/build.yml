name: Build CatSession Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      - name: Verify and Package Built Jars
        run: |
          echo "=== Built Jars ==="
          ls -la build/libs/
          JAR_FILE=$(ls build/libs/catsession*.jar | grep -v "sources" | grep -v "dev" | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            echo "Inspecting $JAR_FILE"
            jar tf "$JAR_FILE" | grep -E "fabric.mod.json|CatSessionMod|CatSessionScreen"
            if [ "$JAR_FILE" != "build/libs/catsession-1.0.1.jar" ]; then
              cp "$JAR_FILE" build/libs/catsession-1.0.1.jar
            fi
            if [ "$JAR_FILE" != "build/libs/catsession.1.0.1.jar" ]; then
              cp "$JAR_FILE" build/libs/catsession.1.0.1.jar
            fi
          else
            echo "Error: Remapped jar not found!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catsession-jars
          path: build/libs/*.jar
          retention-days: 14
